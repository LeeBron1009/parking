<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>城市載客王</title>
<style>
*{box-sizing:border-box;-webkit-user-select:none;user-select:none;touch-action:none;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#222;font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif}
canvas{display:block}
.chip{position:absolute;background:#f6f3ea;border-radius:14px;padding:8px 14px;font-weight:800;color:#1d2735;box-shadow:0 3px 0 #0004;cursor:pointer}
#money{top:12px;left:12px;background:#1d2735;color:#f0b82e;font-size:22px;cursor:default}
#shopBtn{top:62px;left:12px;font-size:14px}
#soundBtn{top:106px;left:12px;font-size:14px}
#msg{top:12px;left:50%;transform:translateX(-50%);font-size:14px;text-align:center;max-width:44%;cursor:default}
#spd{bottom:150px;left:50%;transform:translateX(-50%);font-size:22px;cursor:default;text-align:center}
#spd small{display:block;font-size:11px;color:#667}
#mini{position:absolute;top:12px;right:12px;width:150px;height:150px;border-radius:50%;border:5px solid #1d2735;box-shadow:0 4px 0 #0005;cursor:pointer;background:#8fbf7a}
#hint{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);color:#fff;font-size:12px;opacity:.85;text-shadow:0 1px 3px #000;white-space:nowrap}
#wheel{position:absolute;left:20px;bottom:24px;width:130px;height:130px;border-radius:50%;border:14px solid #1d2735;background:radial-gradient(circle,#f0b82e 0 12%,transparent 13%);box-shadow:0 4px 0 #0005}
#wheel::after{content:"";position:absolute;left:50%;top:-14px;width:10px;height:18px;margin-left:-5px;background:#f0b82e;border-radius:4px}
.pedal{position:absolute;bottom:24px;border-radius:14px;color:#fff;font-weight:800;display:flex;align-items:flex-end;justify-content:center;padding:10px;font-size:15px;box-shadow:0 5px 0 #0006}
#gas{right:100px;width:90px;height:130px;background:#2b3748}
#brk{right:12px;width:80px;height:100px;background:#d23a3a}
.pedal.on{transform:translateY(3px);box-shadow:0 2px 0 #0006}
#shop,#mapWrap{position:absolute;inset:0;background:#000b;display:none;align-items:center;justify-content:center}
#shopBox{background:#f6f3ea;border-radius:18px;padding:16px;width:min(92%,420px);max-height:90%;overflow:auto}
.car{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid #0002;font-weight:700;font-size:14px}
.car small{color:#556;font-weight:500}
button{font:inherit;font-weight:800;border:0;border-radius:10px;padding:8px 12px;background:#f0b82e;cursor:pointer}
button:disabled{opacity:.5}
#full{border-radius:16px;border:5px solid #1d2735;background:#8fbf7a}
#legend{position:absolute;bottom:14px;left:50%;transform:translateX(-50%);color:#fff;font-size:13px;font-weight:700;text-shadow:0 1px 3px #000}
</style>
</head>
<body>
<div id="money" class="chip">$0</div>
<div id="shopBtn" class="chip">🚗 車行 (B)</div>
<div id="soundBtn" class="chip">🔊 聲音</div>
<div id="msg" class="chip">找地圖上的黃點接客!</div>
<canvas id="mini" width="300" height="300"></canvas>
<div id="spd" class="chip">0 km/h<small id="carName"></small></div>
<div id="hint">W/↑ 油門　S/↓ 煞車倒車　A D/←→ 轉向　空白鍵 手煞車　V 切換視角　M 地圖　B 車行</div>
<div id="wheel"></div>
<div id="gas" class="pedal">油門</div>
<div id="brk" class="pedal">煞車倒車</div>
<div id="shop"><div id="shopBox"><h3 style="margin:0 0 8px">車行</h3><div id="list"></div><button id="close" style="margin-top:10px;width:100%">關閉</button></div></div>
<div id="mapWrap"><canvas id="full"></canvas><div id="legend">🟡 乘客　🟢 目的地　🔺 你　(點一下關閉)</div></div>

<script src="https://unpkg.com/three@0.128.0/build/three.min.js"></script>
<script>
/* ============ 基本設定 ============ */
const BLOCK=40,ROAD=14,STEP=54,N=10,SIZE=STEP*N,off=-SIZE/2,HALF=SIZE/2+ROAD/2;
const LIM=HALF-2;
const $=id=>document.getElementById(id);
const scene=new THREE.Scene();
scene.background=new THREE.Color(0x9fd3f5);
scene.fog=new THREE.Fog(0x9fd3f5,90,260);
const cam=new THREE.PerspectiveCamera(68,innerWidth/innerHeight,.1,500);
const ren=new THREE.WebGLRenderer({antialias:true});
ren.setSize(innerWidth,innerHeight);
ren.setPixelRatio(Math.min(devicePixelRatio,2));
ren.shadowMap.enabled=true;
ren.shadowMap.type=THREE.PCFSoftShadowMap;
document.body.insertBefore(ren.domElement,document.body.firstChild);
addEventListener('resize',()=>{ren.setSize(innerWidth,innerHeight);cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix();sizeFull()});

scene.add(new THREE.HemisphereLight(0xdfefff,0x8a8f7a,.65));
const sun=new THREE.DirectionalLight(0xfff2dd,.55);
sun.castShadow=true;
sun.shadow.camera.left=-70;sun.shadow.camera.right=70;sun.shadow.camera.top=70;sun.shadow.camera.bottom=-70;
sun.shadow.camera.near=1;sun.shadow.camera.far=400;
sun.shadow.mapSize.set(2048,2048);
sun.shadow.bias=-0.0008;sun.shadow.normalBias=0.08;
scene.add(sun,sun.target);

const mats={};
const M=c=>mats[c]||(mats[c]=new THREE.MeshLambertMaterial({color:c}));
const B=(w,h,d,c,x=0,y=0,z=0,cast=true)=>{const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),M(c));m.position.set(x,y,z);m.castShadow=cast;return m};

/* ============ 城市 ============ */
const ground=new THREE.Mesh(new THREE.PlaneGeometry(SIZE+400,SIZE+400),M(0x8fbf7a));
ground.rotation.x=-Math.PI/2;ground.position.y=-.05;ground.receiveShadow=true;scene.add(ground);
const roadMat=M(0x4a4f5e);
for(let i=0;i<=N;i++){
  const p=off+i*STEP;
  const r1=new THREE.Mesh(new THREE.PlaneGeometry(SIZE+ROAD,ROAD),roadMat);
  r1.rotation.x=-Math.PI/2;r1.position.set(0,.01,p);r1.receiveShadow=true;scene.add(r1);
  const r2=new THREE.Mesh(new THREE.PlaneGeometry(ROAD,SIZE+ROAD),roadMat);
  r2.rotation.x=-Math.PI/2;r2.position.set(p,.012,0);r2.receiveShadow=true;scene.add(r2);
}
function roadDist(v){const m=(((v-off)%STEP)+STEP)%STEP;return Math.min(m,STEP-m)}
function inRoad(x,z){return roadDist(x)<ROAD/2||roadDist(z)<ROAD/2}

function winTex(base){
  const c=document.createElement('canvas');c.width=c.height=64;const g=c.getContext('2d');
  g.fillStyle=base;g.fillRect(0,0,64,64);
  for(let y=0;y<4;y++)for(let x=0;x<4;x++){
    g.fillStyle=Math.random()<.2?'#ffe9a3':'#46647e';
    g.fillRect(x*16+3,y*16+4,10,9);
  }
  const t=new THREE.CanvasTexture(c);t.wrapS=t.wrapT=THREE.RepeatWrapping;return t;
}
const bcols=['#e8d8b8','#f1b6a0','#b8d4e8','#d9c2e9','#f3e3a0','#c9e0c0'];
const bTex=bcols.map(winTex);
const buildings=[];
for(let i=0;i<N;i++)for(let j=0;j<N;j++){
  const x=off+i*STEP+STEP/2,z=off+j*STEP+STEP/2;
  const side=new THREE.Mesh(new THREE.BoxGeometry(BLOCK,.2,BLOCK),M(0xcfc8b8));
  side.position.set(x,.1,z);side.receiveShadow=true;scene.add(side);
  const down=Math.hypot(x,z)<90;
  for(let a=0;a<2;a++)for(let b=0;b<2;b++){
    const w=15,h=(down?20:8)+Math.random()*(down?40:22);
    const bx=x+(a-.5)*20,bz=z+(b-.5)*20,ci=(Math.random()*bcols.length)|0;
    const t=bTex[ci].clone();t.needsUpdate=true;t.repeat.set(w/8,h/8);
    const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,w),new THREE.MeshLambertMaterial({map:t}));
    m.position.set(bx,h/2+.2,bz);m.castShadow=true;m.receiveShadow=true;scene.add(m);
    if(Math.random()<.5)scene.add(B(3,1.5,3,0x888e99,bx+2,h+.95,bz-2));
    buildings.push({x:bx,z:bz,hw:w/2,col:bcols[ci]});
  }
}
/* 斑馬線、虛線、樹、路燈:用 InstancedMesh 省效能 */
const dummy=new THREE.Object3D();
function inst(geo,mat,list,cast){
  const im=new THREE.InstancedMesh(geo,mat,list.length);
  list.forEach((p,i)=>{dummy.position.set(p[0],p[1]||.03,p[2]);dummy.scale.set(1,p[3]||1,1);dummy.updateMatrix();im.setMatrixAt(i,dummy.matrix)});
  im.castShadow=!!cast;scene.add(im);return im;
}
const white=new THREE.MeshBasicMaterial({color:0xf2f2f2});
const dx=[],dz=[],cx=[],cz=[];
for(let k=0;k<=N;k++){
  const p=off+k*STEP;
  for(let t=-HALF+4;t<HALF-4;t+=7){
    if(roadDist(t)>ROAD/2+2){dx.push([t,.03,p]);dz.push([p,.03,t])}
  }
  for(let m=0;m<=N;m++){
    const q=off+m*STEP;
    for(let s=-5.5;s<=5.6;s+=2.2){
      cx.push([q+9,.035,p+s]);cx.push([q-9,.035,p+s]);
      cz.push([p+s,.035,q+9]);cz.push([p+s,.035,q-9]);
    }
  }
}
inst(new THREE.PlaneGeometry(3,.3).rotateX(-Math.PI/2),white,dx);
inst(new THREE.PlaneGeometry(.3,3).rotateX(-Math.PI/2),white,dz);
inst(new THREE.PlaneGeometry(3.2,.8).rotateX(-Math.PI/2),white,cx.filter((_,i)=>true).filter(p=>true));
inst(new THREE.PlaneGeometry(.8,3.2).rotateX(-Math.PI/2),white,cz);
const trees=[],lamps=[];
for(let i=0;i<N;i++)for(let j=0;j<N;j++){
  const x=off+i*STEP+STEP/2,z=off+j*STEP+STEP/2;
  for(let t=-18;t<=18;t+=9){
    if(Math.abs(t)>16)continue;
    const r=Math.random();
    const e=18.8;
    if(r<.5){trees.push([x+t,.2,z+e]);trees.push([x+t,.2,z-e])}
    else{lamps.push([x+t,.2,z+e]);lamps.push([x+t,.2,z-e])}
    if(Math.random()<.5)trees.push([x+e,.2,z+t]);else lamps.push([x-e,.2,z+t]);
  }
}
const trunk=inst(new THREE.CylinderGeometry(.18,.25,1.8,6).translate(0,.9,0),M(0x6b4a2f),trees.map(p=>[p[0],.2,p[2]]),true);
const crown=inst(new THREE.SphereGeometry(1.5,8,6).translate(0,2.8,0),M(0x3f8f4a),trees.map(p=>[p[0],.2,p[2]]),true);
inst(new THREE.CylinderGeometry(.08,.1,5,6).translate(0,2.5,0),M(0x333a44),lamps.map(p=>[p[0],.2,p[2]]),true);
inst(new THREE.SphereGeometry(.35,8,6).translate(0,5.1,0),new THREE.MeshBasicMaterial({color:0xfff2b0}),lamps.map(p=>[p[0],.2,p[2]]));

/* ============ 車輛模型 ============ */
const CARS=[
 {name:'小白車',price:0,color:0xf8f1e4,kmh:90,acc:5.5,len:4.2,wid:1.9,h:1,cl:2.2,ch:.7,desc:'入門代步'},
 {name:'紅色跑車',price:800,color:0xd23a3a,kmh:130,acc:8,len:4.4,wid:2,h:.85,cl:1.9,ch:.55,desc:'輕快好開'},
 {name:'藍色休旅',price:2500,color:0x2f6fb5,kmh:160,acc:9,len:4.6,wid:2,h:1.2,cl:3,ch:.9,desc:'穩定耐開'},
 {name:'黃色超跑',price:6000,color:0xf0b82e,kmh:200,acc:11,len:4.5,wid:2.1,h:.7,cl:1.7,ch:.5,desc:'加速兇猛'},
 {name:'黑色旗艦',price:12000,color:0x23262d,kmh:240,acc:12.5,len:5.2,wid:2.1,h:1.05,cl:2.8,ch:.75,desc:'城市之王'}
];
function makeCar(s,color){
  const g=new THREE.Group();g.userData.wheels=[];g.userData.fronts=[];
  const bh=.7*s.h,top=.3+bh;
  g.add(B(s.wid,bh,s.len,color,0,.3+bh/2,0));
  const cab=B(s.wid*.88,s.ch,s.cl,0x2d4a63,0,top+s.ch/2,.25);g.add(cab);
  g.add(B(s.wid*.92,.08,s.cl*.92,color,0,top+s.ch+.04,.25));
  g.add(B(s.wid*1.02,.25,.25,0x20242b,0,.45,-s.len/2));
  g.add(B(s.wid*1.02,.25,.25,0x20242b,0,.45,s.len/2));
  [-1,1].forEach(k=>{
    g.add(B(.4,.2,.08,0xfff6c0,k*s.wid*.33,.3+bh*.6,-s.len/2-.02,false));
    g.add(B(.45,.2,.08,0xff3030,k*s.wid*.33,.3+bh*.6,s.len/2+.02,false));
  });
  [[-1,-1],[1,-1],[-1,1],[1,1]].forEach(([sx,sz])=>{
    const steer=new THREE.Group(),spin=new THREE.Group();
    const w=new THREE.Mesh(new THREE.CylinderGeometry(.38,.38,.3,12),M(0x15171c));
    w.rotation.z=Math.PI/2;w.castShadow=true;spin.add(w);
    const hub=new THREE.Mesh(new THREE.CylinderGeometry(.2,.2,.32,8),M(0xb8bcc6));hub.rotation.z=Math.PI/2;spin.add(hub);
    steer.add(spin);steer.position.set(sx*(s.wid/2),.38,sz*s.len*.31);
    g.add(steer);g.userData.wheels.push(spin);if(sz<0)g.userData.fronts.push(steer);
  });
  return g;
}
const car=new THREE.Group();scene.add(car);
let cur=0,owned=[true,false,false,false,false],money=0;
let carMesh=null;
function buildCar(){if(carMesh)car.remove(carMesh);carMesh=makeCar(CARS[cur],CARS[cur].color);car.add(carMesh);$('carName').textContent=CARS[cur].name+' · 極速 '+CARS[cur].kmh}
const startX=off+STEP/2,startZ=off;
car.position.set(startX,0,startZ+3.5);
let heading=Math.PI/2*-1,speed=0,steer=0,wheelRoll=0;

/* ============ 乘客 ============ */
function makePerson(){
  const g=new THREE.Group();
  g.add(B(.7,1.1,.5,0xe08a1e,0,1.1,0));
  const head=new THREE.Mesh(new THREE.SphereGeometry(.38,12,10),M(0xe9b08a));head.position.y=2.0;head.castShadow=true;g.add(head);
  g.add(B(.26,.7,.26,0x333a55,-.17,.35,0));g.add(B(.26,.7,.26,0x333a55,.17,.35,0));
  const arm=new THREE.Group();arm.position.set(.45,1.55,0);arm.add(B(.2,.7,.2,0xe08a1e,0,.3,0));g.add(arm);
  g.add(B(.2,.6,.2,0xe08a1e,-.45,1.2,0));
  g.userData.arm=arm;return g;
}
function roadPoint(side){
  for(let n=0;n<50;n++){
    const i=(Math.random()*(N+1))|0,t=(Math.random()-.5)*(SIZE-40);
    if(roadDist(t)<ROAD/2+3)continue;
    const p=off+i*STEP,s=side?ROAD/2+.9:(Math.random()<.5?1:-1)*3;
    const sg=Math.random()<.5?1:-1;
    return Math.random()<.5?{x:t,z:p+(side?sg*s:s)}:{x:p+(side?sg*s:s),z:t};
  }
  return {x:0,z:off+ROAD/2+.9};
}
const pax=[];
function spawnPax(){
  const pos=roadPoint(true);
  const g=new THREE.Group();const person=makePerson();g.add(person);g.userData.person=person;
  const beam=new THREE.Mesh(new THREE.CylinderGeometry(1.3,1.3,30,16,1,true),new THREE.MeshBasicMaterial({color:0xf0b82e,transparent:true,opacity:.3,side:THREE.DoubleSide,depthWrite:false}));
  beam.position.y=15;g.add(beam);g.userData.beam=beam;
  g.position.set(pos.x,.2,pos.z);g.userData.ph=Math.random()*6;scene.add(g);pax.push(g);
}
for(let i=0;i<14;i++)spawnPax();
const destMark=new THREE.Mesh(new THREE.CylinderGeometry(2.5,2.5,34,20,1,true),new THREE.MeshBasicMaterial({color:0x3cb371,transparent:true,opacity:.38,side:THREE.DoubleSide,depthWrite:false}));
destMark.visible=false;scene.add(destMark);
let trip=null;
const say=t=>{$('msg').textContent=t};

/* ============ 電腦車流 ============ */
const ai=[];
const AICOL=[0xd9534f,0x5bc0de,0xf0ad4e,0x8e7cc3,0x6aa84f,0xeeeeee,0x444c5a];
function aiHeading(a){return a.axis==='x'?(a.dir>0?-Math.PI/2:Math.PI/2):(a.dir>0?Math.PI:0)}
function aiPlace(a){
  if(a.axis==='x'){a.g.position.z=a.line+a.dir*3.5}else{a.g.position.x=a.line-a.dir*3.5}
}
for(let n=0;n<18;n++){
  const s=CARS[(Math.random()*3)|0];
  const g=makeCar(s,AICOL[(Math.random()*AICOL.length)|0]);
  const a={g,spec:s,axis:Math.random()<.5?'x':'z',dir:Math.random()<.5?1:-1,line:off+((Math.random()*(N+1))|0)*STEP,v:8+Math.random()*5,roll:0};
  const along=(Math.random()-.5)*(SIZE-20);
  if(a.axis==='x')g.position.x=along;else g.position.z=along;
  aiPlace(a);g.rotation.y=aiHeading(a);g.position.y=0;scene.add(g);ai.push(a);
}
function updateAI(dt){
  ai.forEach(a=>{
    const p=a.g.position;
    const key=a.axis==='x'?'x':'z',other=a.axis==='x'?'z':'x';
    const prev=p[key];
    let slow=1;
    const fx=a.axis==='x'?a.dir:0,fz=a.axis==='z'?a.dir:0;
    const rx=car.position.x-p.x,rz=car.position.z-p.z,fd=rx*fx+rz*fz,sd=Math.abs(rx*fz-rz*fx);
    if(fd>0&&fd<14&&sd<3)slow=Math.max(0,(fd-5)/9);
    for(const o of ai){if(o===a)continue;const ox=o.g.position.x-p.x,oz=o.g.position.z-p.z,d=ox*fx+oz*fz,s2=Math.abs(ox*fz-oz*fx);if(d>0&&d<12&&s2<2.5)slow=Math.min(slow,Math.max(0,(d-5)/7))}
    p[key]+=a.dir*a.v*slow*dt;
    const kp=Math.floor((prev-off)/STEP),kn=Math.floor((p[key]-off)/STEP);
    if(kp!==kn){
      const c=off+Math.max(kp,kn)*STEP;
      if(Math.random()<.3){
        const cz=a.line;
        a.axis=a.axis==='x'?'z':'x';a.dir=Math.random()<.5?1:-1;a.line=c;
        p[a.axis==='x'?'z':'x']=0;
        if(a.axis==='x'){p.z=a.line;p.x=cz===undefined?p.x:c}else{p.x=a.line;p.z=cz}
        aiPlace(a);
      }
    }
    if(Math.abs(p[key])>LIM-3){a.dir=-a.dir;p[key]=Math.sign(p[key])*(LIM-3.5);aiPlace(a)}
    aiPlace(a);
    let target=aiHeading(a),d=target-a.g.rotation.y;
    d=Math.atan2(Math.sin(d),Math.cos(d));a.g.rotation.y+=d*Math.min(1,dt*6);
    a.roll+=a.v*slow*dt/.38;a.g.userData.wheels.forEach(w=>w.rotation.x=a.roll);
  });
}

/* ============ 輸入 ============ */
let gas=false,brk=false,paused=false;
const on=(el,f)=>{el.addEventListener('pointerdown',e=>{f(true);el.classList.add('on');initAudio();e.preventDefault()});['pointerup','pointercancel','pointerleave'].forEach(n=>el.addEventListener(n,()=>{f(false);el.classList.remove('on')}))};
on($('gas'),v=>gas=v);on($('brk'),v=>brk=v);
const wheel=$('wheel');let wheelAng=0,dragging=false,touchSteer=0;
function wheelPos(e){const r=wheel.getBoundingClientRect();return Math.atan2(e.clientX-(r.left+r.width/2),-(e.clientY-(r.top+r.height/2)))}
wheel.addEventListener('pointerdown',e=>{dragging=true;wheel.setPointerCapture(e.pointerId);initAudio()});
wheel.addEventListener('pointermove',e=>{if(!dragging)return;wheelAng=Math.max(-1.3,Math.min(1.3,wheelPos(e)));touchSteer=wheelAng/1.3});
const endW=()=>{dragging=false;touchSteer=0;wheelAng=0};
wheel.addEventListener('pointerup',endW);wheel.addEventListener('pointercancel',endW);
const keys={};
let camMode=0;
addEventListener('keydown',e=>{
  initAudio();
  const k=e.key.toLowerCase();keys[k]=true;
  if(['arrowup','arrowdown','arrowleft','arrowright',' '].includes(k))e.preventDefault();
  if(k==='v')camMode=(camMode+1)%3;
  if(k==='m')toggleMap();
  if(k==='b')toggleShop();
  if(k==='escape'){closeMap();closeShop()}
});
addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);

/* ============ 車行 ============ */
const shop=$('shop'),list=$('list');
function renderShop(){
  list.innerHTML='';
  CARS.forEach((c,i)=>{
    const d=document.createElement('div');d.className='car';
    d.innerHTML=`<span>${c.name}<br><small>極速 ${c.kmh} km/h · ${c.desc}</small></span>`;
    const b=document.createElement('button');
    if(owned[i]){b.textContent=cur===i?'使用中':'使用';b.disabled=cur===i}
    else{b.textContent='$'+c.price;b.disabled=money<c.price}
    b.onclick=()=>{
      if(!owned[i]){money-=c.price;owned[i]=true}
      cur=i;buildCar();renderShop();updateMoney();save();
    };
    d.appendChild(b);list.appendChild(d);
  });
}
function toggleShop(){if(shop.style.display==='flex')closeShop();else{closeMap();renderShop();shop.style.display='flex';paused=true}}
function closeShop(){shop.style.display='none';if($('mapWrap').style.display!=='flex')paused=false}
$('shopBtn').onclick=toggleShop;$('close').onclick=closeShop;
const updateMoney=()=>$('money').textContent='$'+Math.floor(money);
function save(){try{localStorage.setItem('cityTaxi2',JSON.stringify({money,owned,cur}))}catch(e){}}
try{const s=JSON.parse(localStorage.getItem('cityTaxi2'));if(s){money=s.money;owned=s.owned;cur=s.cur}}catch(e){}
buildCar();updateMoney();

/* ============ 聲音 ============ */
let ac,osc,gn,mute=false;
function initAudio(){
  if(ac)return;
  try{
    ac=new(window.AudioContext||window.webkitAudioContext)();
    osc=ac.createOscillator();osc.type='sawtooth';
    const f=ac.createBiquadFilter();f.type='lowpass';f.frequency.value=420;
    gn=ac.createGain();gn.gain.value=0;
    osc.connect(f);f.connect(gn);gn.connect(ac.destination);osc.start();
  }catch(e){}
}
$('soundBtn').onclick=()=>{mute=!mute;$('soundBtn').textContent=mute?'🔇 靜音':'🔊 聲音';initAudio()};

/* ============ 小地圖與大地圖 ============ */
const MW=2*HALF+20,MS=1024/MW,MMIN=-(HALF+10);
const mapC=document.createElement('canvas');mapC.width=mapC.height=1024;
(function(){
  const g=mapC.getContext('2d');
  const X=v=>(v-MMIN)*MS;
  g.fillStyle='#8fbf7a';g.fillRect(0,0,1024,1024);
  g.fillStyle='#cfc8b8';
  for(let i=0;i<N;i++)for(let j=0;j<N;j++)g.fillRect(X(off+i*STEP+STEP/2-BLOCK/2),X(off+j*STEP+STEP/2-BLOCK/2),BLOCK*MS,BLOCK*MS);
  g.fillStyle='#e9e5da';
  for(let i=0;i<=N;i++){g.fillRect(X(off+i*STEP-ROAD/2),X(-HALF),ROAD*MS,2*HALF*MS);g.fillRect(X(-HALF),X(off+i*STEP-ROAD/2),2*HALF*MS,ROAD*MS)}
  buildings.forEach(b=>{g.fillStyle='#b9b3a3';g.fillRect(X(b.x-b.hw),X(b.z-b.hw),b.hw*2*MS,b.hw*2*MS)});
})();
const mini=$('mini'),mctx=mini.getContext('2d');
function drawMini(){
  const R=150,k=1.5-Math.min(.6,Math.abs(speed)/70*.6);
  const f=Math.atan2(-Math.cos(heading),-Math.sin(heading)),th=-Math.PI/2-f;
  mctx.clearRect(0,0,300,300);
  mctx.save();mctx.beginPath();mctx.arc(R,R,R,0,7);mctx.clip();
  mctx.fillStyle='#8fbf7a';mctx.fillRect(0,0,300,300);
  mctx.translate(R,R);mctx.rotate(th);mctx.scale(2*k/MS,2*k/MS);
  mctx.translate(-(car.position.x-MMIN)*MS,-(car.position.z-MMIN)*MS);
  mctx.drawImage(mapC,0,0);mctx.restore();
  const c=Math.cos(th),s=Math.sin(th);
  const pt=(wx,wz)=>{const ax=(wx-car.position.x)*2*k,az=(wz-car.position.z)*2*k;return[R+ax*c-az*s,R+ax*s+az*c]};
  const dot=(p,col,r,clamp)=>{
    let [x,y]=p;const dd=Math.hypot(x-R,y-R);
    if(dd>R-12){if(!clamp)return;x=R+(x-R)*(R-12)/dd;y=R+(y-R)*(R-12)/dd}
    mctx.beginPath();mctx.arc(x,y,r,0,7);mctx.fillStyle=col;mctx.fill();mctx.lineWidth=3;mctx.strokeStyle='#1d2735';mctx.stroke();
  };
  if(!trip)pax.forEach(p=>dot(pt(p.position.x,p.position.z),'#f0b82e',9,false));
  if(trip)dot(pt(trip.x,trip.z),'#3cb371',11,true);
  mctx.save();mctx.translate(R,R);mctx.fillStyle='#e8402f';mctx.strokeStyle='#fff';mctx.lineWidth=3;
  mctx.beginPath();mctx.moveTo(0,-16);mctx.lineTo(11,12);mctx.lineTo(0,6);mctx.lineTo(-11,12);mctx.closePath();mctx.fill();mctx.stroke();mctx.restore();
  mctx.beginPath();mctx.arc(R,R,R-2,0,7);mctx.lineWidth=4;mctx.strokeStyle='#1d2735';mctx.stroke();
  mctx.fillStyle='#fff';mctx.font='bold 22px sans-serif';mctx.textAlign='center';mctx.fillText('N',R+Math.sin(-th)*(R-18)*-1*-1*0+0,22);
}
const full=$('full'),fctx=full.getContext('2d');
function sizeFull(){const s=Math.min(innerWidth,innerHeight)*.86|0;full.width=full.height=s;full.style.width=full.style.height=s+'px'}
sizeFull();
function drawFull(){
  const S=full.width,F=v=>(v-MMIN)*S/MW;
  fctx.drawImage(mapC,0,0,S,S);
  const dot=(x,z,col,r)=>{fctx.beginPath();fctx.arc(F(x),F(z),r,0,7);fctx.fillStyle=col;fctx.fill();fctx.lineWidth=2;fctx.strokeStyle='#1d2735';fctx.stroke()};
  if(!trip)pax.forEach(p=>dot(p.position.x,p.position.z,'#f0b82e',7));
  if(trip)dot(trip.x,trip.z,'#3cb371',10);
  const a=Math.atan2(-Math.cos(heading),-Math.sin(heading));
  fctx.save();fctx.translate(F(car.position.x),F(car.position.z));fctx.rotate(a);
  fctx.fillStyle='#e8402f';fctx.strokeStyle='#fff';fctx.lineWidth=2;
  fctx.beginPath();fctx.moveTo(14,0);fctx.lineTo(-10,9);fctx.lineTo(-5,0);fctx.lineTo(-10,-9);fctx.closePath();fctx.fill();fctx.stroke();fctx.restore();
}
function toggleMap(){if($('mapWrap').style.display==='flex')closeMap();else{closeShop();$('mapWrap').style.display='flex';paused=true}}
function closeMap(){$('mapWrap').style.display='none';if(shop.style.display!=='flex')paused=false}
mini.addEventListener('click',toggleMap);$('mapWrap').addEventListener('click',closeMap);

/* ============ 主迴圈 ============ */
const clock=new THREE.Clock();
let ky=0;
function loop(){
  requestAnimationFrame(loop);
  const dt=Math.min(clock.getDelta(),.05),t=clock.elapsedTime;
  if($('mapWrap').style.display==='flex')drawFull();
  if(!paused){
    const C=CARS[cur],vmax=C.kmh/3.6;
    const gasIn=gas||keys['w']||keys['arrowup'];
    const brkIn=brk||keys['s']||keys['arrowdown'];
    const hand=keys[' '];
    let sIn=dragging?touchSteer:((keys['d']||keys['arrowright']?1:0)-(keys['a']||keys['arrowleft']?1:0));
    steer+=(sIn-steer)*Math.min(1,dt*(sIn===0?9:6));

    if(gasIn){
      if(speed<0)speed+=(C.acc+25)*dt;
      else speed+=C.acc*Math.max(0,1-speed/(vmax*1.02))*dt;
    }else if(brkIn){
      if(speed>.4)speed-=(C.acc*2+22)*dt;
      else speed=Math.max(-8,speed-5*dt);
    }else{
      speed-=Math.sign(speed)*Math.min(Math.abs(speed),(1.2+Math.abs(speed)*.05)*dt);
    }
    if(hand){speed-=Math.sign(speed)*Math.min(Math.abs(speed),30*dt)}
    speed=Math.max(-8,Math.min(vmax,speed));

    const delta=steer*.62/(1+Math.abs(speed)/9)*(hand?1.6:1);
    heading-=speed/2.8*Math.tan(delta)*dt;
    const fx=-Math.sin(heading),fz=-Math.cos(heading);
    let nx=car.position.x+fx*speed*dt,nz=car.position.z+fz*speed*dt,hit=false;
    const R=1.3;
    const hitAt=(x,z)=>{
      if(Math.abs(x)>LIM||Math.abs(z)>LIM)return true;
      for(const b of buildings)if(Math.abs(x-b.x)<b.hw+R&&Math.abs(z-b.z)<b.hw+R)return true;
      return false;
    };
    let px=car.position.x,pz=car.position.z;
    if(!hitAt(nx,pz))px=nx;else hit=true;
    if(!hitAt(px,nz))pz=nz;else hit=true;
    car.position.x=px;car.position.z=pz;
    if(hit&&Math.abs(speed)>2){speed*=-.25;say('撞到了!')}
    for(const a of ai){
      const ddx=car.position.x-a.g.position.x,ddz=car.position.z-a.g.position.z,d=Math.hypot(ddx,ddz);
      if(d<3.4){
        car.position.x+=ddx/d*(3.4-d)*.6;car.position.z+=ddz/d*(3.4-d)*.6;
        a.g.position.x-=ddx/d*(3.4-d)*.4;a.g.position.z-=ddz/d*(3.4-d)*.4;
        if(Math.abs(speed)>3){speed*=.5;say('小心車輛!')}
      }
    }
    const ty=inRoad(car.position.x,car.position.z)?0:.2;
    car.position.y+=(ty-car.position.y)*Math.min(1,dt*14);
    car.rotation.y=heading;
    wheelRoll+=speed*dt/.38;
    carMesh.userData.wheels.forEach(w=>w.rotation.x=wheelRoll);
    carMesh.userData.fronts.forEach(w=>w.rotation.y=-delta*2);

    updateAI(dt);

    /* 載客 */
    const slow=Math.abs(speed)<3;
    if(!trip){
      let near=1e9,np=null,ni=-1;
      pax.forEach((p,i)=>{const d=p.position.distanceTo(car.position);if(d<near){near=d;np=p;ni=i}});
      if(near<6&&slow){
        const from={x:np.position.x,z:np.position.z};
        scene.remove(np);pax.splice(ni,1);
        let d,dist;
        for(let n=0;n<40;n++){d=roadPoint(false);dist=Math.hypot(d.x-from.x,d.z-from.z);if(dist>120&&dist<420)break}
        const limit=dist/14+25;
        trip={x:d.x,z:d.z,dist,limit,t0:t};
        destMark.position.set(d.x,17,d.z);destMark.visible=true;
        say('乘客上車!開到綠色光柱');
      }else if(near<25)say('靠近乘客,放慢到 10 km/h 以下上車');
      else say('找地圖上的黃點接客!');
    }else{
      const dd=Math.hypot(trip.x-car.position.x,trip.z-car.position.z);
      const left=Math.max(0,trip.limit-(t-trip.t0));
      if(dd<6&&slow){
        const fare=Math.round(25+trip.dist*.45+left*1.5);
        money+=fare;updateMoney();save();
        say('抵達!車資 $'+fare+(left>0?'(含準時獎金)':''));
        trip=null;destMark.visible=false;
      }else say('送客中 · 距離 '+Math.round(dd)+' m · ⏱ '+Math.ceil(left)+' 秒');
    }
    while(pax.length<14)spawnPax();
    pax.forEach(p=>{
      p.userData.beam.material.opacity=.22+.12*Math.sin(t*3+p.userData.ph);
      p.userData.person.position.y=Math.abs(Math.sin(t*4+p.userData.ph))*.08;
      p.userData.person.userData.arm.rotation.z=2.6+Math.sin(t*7+p.userData.ph)*.4;
      p.lookAt(car.position.x,p.position.y,car.position.z);
    });
    $('spd').firstChild.nodeValue=Math.round(Math.abs(speed)*3.6)+' km/h';

    /* 聲音 */
    if(gn){
      osc.frequency.value=45+Math.abs(speed)*2.4%160+(gasIn?12:0);
      gn.gain.value=mute?0:.035+(gasIn?.03:0);
    }
  }
  wheel.style.transform=`rotate(${(dragging?wheelAng:steer*1.3)}rad)`;

  /* 鏡頭:壓低、拉遠,看得到前方更多路 */
  const fx=-Math.sin(heading),fz=-Math.cos(heading),v=Math.abs(speed);
  cam.fov+=(66+Math.min(20,v*.35)-cam.fov)*Math.min(1,dt*4);cam.updateProjectionMatrix();
  if(camMode===2){
    cam.position.set(car.position.x+fx*.3,car.position.y+1.5,car.position.z+fz*.3);
    cam.lookAt(car.position.x+fx*30,car.position.y+1.3,car.position.z+fz*30);
  }else{
    const m=camMode===0?{d:8,h:2.6,look:18,ly:1.1}:{d:13,h:5.5,look:12,ly:1};
    const tg=new THREE.Vector3(car.position.x-fx*m.d,car.position.y+m.h,car.position.z-fz*m.d);
    cam.position.lerp(tg,1-Math.exp(-9*dt));
    cam.lookAt(car.position.x+fx*m.look,car.position.y+m.ly,car.position.z+fz*m.look);
  }
  sun.position.set(car.position.x+60,100,car.position.z+35);sun.target.position.copy(car.position);
  drawMini();
  ren.render(scene,cam);
}
loop();
</script>
