<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>城市載客王</title>
<style>
*{box-sizing:border-box;-webkit-user-select:none;user-select:none;touch-action:none;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#222;font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif}
canvas{display:block}
.chip{position:absolute;background:#f6f3ea;border-radius:14px;padding:8px 14px;font-weight:800;color:#1d2735;box-shadow:0 3px 0 #0004;cursor:pointer}
#money{top:12px;left:12px;background:#1d2735;color:#f0b82e;font-size:22px;cursor:default}
#shopBtn{top:62px;left:12px;font-size:14px}
#soundBtn{top:106px;left:12px;font-size:14px}
#msg{top:12px;left:50%;transform:translateX(-50%);font-size:14px;text-align:center;max-width:42%;cursor:default;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#card{position:absolute;top:56px;left:50%;transform:translateX(-50%);width:220px;background:#f6f3ea;border-radius:14px;padding:8px 12px;border-left:8px solid #999;box-shadow:0 3px 0 #0004;font-size:13px;font-weight:700;color:#1d2735}
#cTitle{font-size:15px;font-weight:900}
#cLine{margin:2px 0 4px;min-height:18px}
#cBarW{height:7px;background:#0002;border-radius:4px;overflow:hidden}
#cBar{height:100%;width:0;background:#3cb371}
#cAbort{margin-top:6px;padding:4px 8px;font-size:12px;background:#d9d3c2}
#spd{bottom:150px;left:50%;transform:translateX(-50%);font-size:22px;cursor:default;text-align:center}
#spd small{display:block;font-size:11px;color:#667}
#mini{position:absolute;top:12px;right:12px;width:150px;height:150px;border-radius:50%;box-shadow:0 4px 0 #0005;cursor:pointer}
#hint{position:absolute;bottom:6px;left:50%;transform:translateX(-50%);color:#fff;font-size:11px;opacity:.85;text-shadow:0 1px 3px #000;white-space:nowrap;pointer-events:none}
#wheel{position:absolute;left:20px;bottom:24px;width:130px;height:130px;border-radius:50%;border:14px solid #1d2735;background:radial-gradient(circle,#f0b82e 0 12%,transparent 13%);box-shadow:0 4px 0 #0005}
#wheel::after{content:"";position:absolute;left:50%;top:-14px;width:10px;height:18px;margin-left:-5px;background:#f0b82e;border-radius:4px}
.pedal{position:absolute;bottom:24px;border-radius:14px;color:#fff;font-weight:800;display:flex;align-items:flex-end;justify-content:center;padding:10px;font-size:15px;box-shadow:0 5px 0 #0006}
#gas{right:100px;width:90px;height:130px;background:#2b3748}
#brk{right:12px;width:80px;height:100px;background:#d23a3a}
.pedal.on{transform:translateY(3px);box-shadow:0 2px 0 #0006}
#shop,#mapWrap{position:absolute;inset:0;background:#000b;display:none;align-items:center;justify-content:center}
#shopBox{background:#f6f3ea;border-radius:18px;padding:16px;width:min(92%,420px);max-height:90%;overflow:auto}
.car{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid #0002;font-weight:700;font-size:14px}
.car small{color:#556;font-weight:500}
button{font:inherit;font-weight:800;border:0;border-radius:10px;padding:8px 12px;background:#f0b82e;cursor:pointer}
button:disabled{opacity:.5}
#full{border-radius:16px;border:5px solid #1d2735;background:#8fbf7a}
#legend{position:absolute;bottom:14px;left:50%;transform:translateX(-50%);color:#fff;font-size:13px;font-weight:700;text-shadow:0 1px 3px #000;white-space:nowrap}
#flash{position:absolute;inset:0;pointer-events:none;opacity:0;background:radial-gradient(ellipse at center,rgba(255,0,0,0) 45%,rgba(255,30,30,.65) 100%)}
#toast{position:absolute;top:30%;left:50%;transform:translateX(-50%);background:#1d2735;color:#f0b82e;font-size:26px;font-weight:900;padding:12px 24px;border-radius:18px;box-shadow:0 5px 0 #0006;opacity:0;pointer-events:none;text-align:center;white-space:pre-line}
#toast.show{animation:pop 3s ease forwards}
@keyframes pop{0%{opacity:0;transform:translate(-50%,20px) scale(.8)}10%{opacity:1;transform:translate(-50%,0) scale(1.05)}18%{transform:translate(-50%,0) scale(1)}80%{opacity:1}100%{opacity:0;transform:translate(-50%,-20px)}}
</style>
</head>
<body>
<div id="flash"></div>
<div id="money" class="chip">$0</div>
<div id="shopBtn" class="chip">🚗 車行 (B)</div>
<div id="soundBtn" class="chip">🔊 聲音</div>
<div id="msg" class="chip">找地圖上的彩色點接單!</div>
<div id="card"><div id="cTitle">待命中</div><div id="cLine">開到彩色圓點旁接單</div><div id="cBarW"><div id="cBar"></div></div><button id="cAbort" style="display:none">放棄任務 (X)</button></div>
<canvas id="mini" width="300" height="300"></canvas>
<div id="spd" class="chip">0 km/h<small id="carName"></small></div>
<div id="hint">W/↑ 油門　S/↓ 煞車倒車　A D/←→ 轉向　空白鍵 手煞車　V 視角　M 地圖　B 車行　X 放棄任務</div>
<div id="wheel"></div>
<div id="gas" class="pedal">油門</div>
<div id="brk" class="pedal">煞車倒車</div>
<div id="toast"></div>
<div id="shop"><div id="shopBox"><h3 style="margin:0 0 8px">車行</h3><div id="list"></div><button id="close" style="margin-top:10px;width:100%">關閉</button></div></div>
<div id="mapWrap"><canvas id="full"></canvas><div id="legend">🟡載客 🔴趕時間 🟣貴賓 🔵多點接送 🟢代客停車 · 🔺你 · 點一下關閉</div></div>

<script src="https://unpkg.com/three@0.128.0/build/three.min.js"></script>
<script>
/* ================= 基本設定 ================= */
const BLOCK=40,ROAD=14,STEP=54,N=10,SIZE=STEP*N,off=-SIZE/2,HALF=SIZE/2+ROAD/2,LIM=HALF-2,LANE=3.1;
const $=id=>document.getElementById(id);
const setText=(el,t)=>{if(el._t!==t){el.textContent=t;el._t=t}};
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const scene=new THREE.Scene();
scene.background=new THREE.Color(0x9fd3f5);
scene.fog=new THREE.Fog(0x9fd3f5,90,260);
const cam=new THREE.PerspectiveCamera(68,innerWidth/innerHeight,.1,500);
const ren=new THREE.WebGLRenderer({antialias:true});
ren.setSize(innerWidth,innerHeight);
ren.setPixelRatio(Math.min(devicePixelRatio,2));
ren.shadowMap.enabled=true;
ren.shadowMap.type=THREE.PCFSoftShadowMap;
document.body.insertBefore(ren.domElement,document.body.firstChild);
addEventListener('resize',()=>{ren.setSize(innerWidth,innerHeight);cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix();sizeFull()});
scene.add(new THREE.HemisphereLight(0xdfefff,0x8a8f7a,.65));
const sun=new THREE.DirectionalLight(0xfff2dd,.55);
sun.castShadow=true;
sun.shadow.camera.left=-70;sun.shadow.camera.right=70;sun.shadow.camera.top=70;sun.shadow.camera.bottom=-70;
sun.shadow.camera.near=1;sun.shadow.camera.far=400;
sun.shadow.mapSize.set(2048,2048);
sun.shadow.bias=-0.0008;sun.shadow.normalBias=0.08;
scene.add(sun,sun.target);
const mats={};
const M=c=>mats[c]||(mats[c]=new THREE.MeshLambertMaterial({color:c}));
const B=(w,h,d,c,x=0,y=0,z=0,cast=true)=>{const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),M(c));m.position.set(x,y,z);m.castShadow=cast;return m};

/* ================= 城市 ================= */
const ground=new THREE.Mesh(new THREE.PlaneGeometry(SIZE+400,SIZE+400),M(0x8fbf7a));
ground.rotation.x=-Math.PI/2;ground.position.y=-.05;ground.receiveShadow=true;scene.add(ground);
const roadMat=M(0x4a4f5e);
for(let i=0;i<=N;i++){
  const p=off+i*STEP;
  const r1=new THREE.Mesh(new THREE.PlaneGeometry(SIZE+ROAD,ROAD),roadMat);
  r1.rotation.x=-Math.PI/2;r1.position.set(0,.01,p);r1.receiveShadow=true;scene.add(r1);
  const r2=new THREE.Mesh(new THREE.PlaneGeometry(ROAD,SIZE+ROAD),roadMat);
  r2.rotation.x=-Math.PI/2;r2.position.set(p,.012,0);r2.receiveShadow=true;scene.add(r2);
}
function roadDist(v){const m=(((v-off)%STEP)+STEP)%STEP;return Math.min(m,STEP-m)}
function inRoad(x,z){return roadDist(x)<ROAD/2||roadDist(z)<ROAD/2}
function winTex(base){
  const c=document.createElement('canvas');c.width=c.height=64;const g=c.getContext('2d');
  g.fillStyle=base;g.fillRect(0,0,64,64);
  for(let y=0;y<4;y++)for(let x=0;x<4;x++){g.fillStyle=Math.random()<.2?'#ffe9a3':'#46647e';g.fillRect(x*16+3,y*16+4,10,9)}
  const t=new THREE.CanvasTexture(c);t.wrapS=t.wrapT=THREE.RepeatWrapping;return t;
}
const bcols=['#e8d8b8','#f1b6a0','#b8d4e8','#d9c2e9','#f3e3a0','#c9e0c0'];
const bTex=bcols.map(winTex);
const buildings=[];
for(let i=0;i<N;i++)for(let j=0;j<N;j++){
  const x=off+i*STEP+STEP/2,z=off+j*STEP+STEP/2;
  const side=new THREE.Mesh(new THREE.BoxGeometry(BLOCK,.2,BLOCK),M(0xcfc8b8));
  side.position.set(x,.1,z);side.receiveShadow=true;scene.add(side);
  const down=Math.hypot(x,z)<90;
  for(let a=0;a<2;a++)for(let b=0;b<2;b++){
    const w=15,h=(down?20:8)+Math.random()*(down?40:22);
    const bx=x+(a-.5)*20,bz=z+(b-.5)*20,ci=(Math.random()*bcols.length)|0;
    const t=bTex[ci].clone();t.needsUpdate=true;t.repeat.set(w/8,h/8);
    const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,w),new THREE.MeshLambertMaterial({map:t}));
    m.position.set(bx,h/2+.2,bz);m.castShadow=true;m.receiveShadow=true;scene.add(m);
    if(Math.random()<.5)scene.add(B(3,1.5,3,0x888e99,bx+2,h+.95,bz-2));
    buildings.push({x:bx,z:bz,hw:w/2,hl:w/2,ang:0,vx:0,vz:0,w:0,im:0,iI:0,col:bcols[ci]});
  }
}
const dummy=new THREE.Object3D();
function inst(geo,mat,list,cast){
  const im=new THREE.InstancedMesh(geo,mat,list.length);
  list.forEach((p,i)=>{dummy.position.set(p[0],p[1]||.03,p[2]);dummy.updateMatrix();im.setMatrixAt(i,dummy.matrix)});
  im.castShadow=!!cast;scene.add(im);return im;
}
const white=new THREE.MeshBasicMaterial({color:0xf2f2f2});
const dx=[],dz=[],cx=[],cz=[];
for(let k=0;k<=N;k++){
  const p=off+k*STEP;
  for(let t=-HALF+4;t<HALF-4;t+=7){if(roadDist(t)>ROAD/2+2){dx.push([t,.03,p]);dz.push([p,.03,t])}}
  for(let m=0;m<=N;m++){
    const q=off+m*STEP;
    for(let s=-5.5;s<=5.6;s+=2.2){cx.push([q+9,.035,p+s],[q-9,.035,p+s]);cz.push([p+s,.035,q+9],[p+s,.035,q-9])}
  }
}
inst(new THREE.PlaneGeometry(3,.3).rotateX(-Math.PI/2),white,dx);
inst(new THREE.PlaneGeometry(.3,3).rotateX(-Math.PI/2),white,dz);
inst(new THREE.PlaneGeometry(3.2,.8).rotateX(-Math.PI/2),white,cx);
inst(new THREE.PlaneGeometry(.8,3.2).rotateX(-Math.PI/2),white,cz);
const trees=[],lamps=[];
for(let i=0;i<N;i++)for(let j=0;j<N;j++){
  const x=off+i*STEP+STEP/2,z=off+j*STEP+STEP/2,e=18.8;
  for(let t=-9;t<=9;t+=9){
    if(Math.random()<.5){trees.push([x+t,.2,z+e],[x+t,.2,z-e])}else{lamps.push([x+t,.2,z+e],[x+t,.2,z-e])}
    if(Math.random()<.5)trees.push([x+e,.2,z+t]);else lamps.push([x-e,.2,z+t]);
  }
}
inst(new THREE.CylinderGeometry(.18,.25,1.8,6).translate(0,.9,0),M(0x6b4a2f),trees,true);
inst(new THREE.SphereGeometry(1.5,8,6).translate(0,2.8,0),M(0x3f8f4a),trees,true);
inst(new THREE.CylinderGeometry(.08,.1,5,6).translate(0,2.5,0),M(0x333a44),lamps,true);
inst(new THREE.SphereGeometry(.35,8,6).translate(0,5.1,0),new THREE.MeshBasicMaterial({color:0xfff2b0}),lamps);

/* ================= 停車格 ================= */
const BAY_L=6.2,BAY_W=2.8,BAY_OFF=5.6;
const bays=[];
for(let k=0;k<=N;k++){
  const p=off+k*STEP;
  for(let j=0;j<N;j++){
    const c=off+j*STEP+STEP/2;
    for(const o of[-9.5,9.5])for(const sd of[-1,1]){
      bays.push({axis:'x',x:c+o,z:p+sd*BAY_OFF,occ:false});
      bays.push({axis:'z',x:p+sd*BAY_OFF,z:c+o,occ:false});
    }
  }
}
(function(){
  const lxl=[],lxs=[],lzl=[],lzs=[];
  bays.forEach(b=>{
    if(b.axis==='x'){lxl.push([b.x,.04,b.z-BAY_W/2],[b.x,.04,b.z+BAY_W/2]);lxs.push([b.x-BAY_L/2,.04,b.z],[b.x+BAY_L/2,.04,b.z])}
    else{lzl.push([b.x-BAY_W/2,.04,b.z],[b.x+BAY_W/2,.04,b.z]);lzs.push([b.x,.04,b.z-BAY_L/2],[b.x,.04,b.z+BAY_L/2])}
  });
  const lm=new THREE.MeshBasicMaterial({color:0xe8e4d0});
  inst(new THREE.PlaneGeometry(BAY_L,.14).rotateX(-Math.PI/2),lm,lxl);
  inst(new THREE.PlaneGeometry(.14,BAY_W).rotateX(-Math.PI/2),lm,lxs);
  inst(new THREE.PlaneGeometry(.14,BAY_L).rotateX(-Math.PI/2),lm,lzl);
  inst(new THREE.PlaneGeometry(BAY_W,.14).rotateX(-Math.PI/2),lm,lzs);
})();
const bayHL=new THREE.Mesh(new THREE.PlaneGeometry(BAY_L,BAY_W).rotateX(-Math.PI/2),new THREE.MeshBasicMaterial({color:0x2fbf9a,transparent:true,opacity:.5,depthWrite:false}));
bayHL.visible=false;scene.add(bayHL);

/* ================= 車輛模型 ================= */
const CARS=[
 {name:'小白車',price:0,color:0xf8f1e4,kmh:90,acc:5.5,len:4.2,wid:1.9,h:1,cl:2.2,ch:.7,mass:1000,desc:'入門代步'},
 {name:'紅色跑車',price:800,color:0xd23a3a,kmh:130,acc:8,len:4.4,wid:2,h:.85,cl:1.9,ch:.55,mass:1150,desc:'輕快好開'},
 {name:'藍色休旅',price:2500,color:0x2f6fb5,kmh:160,acc:9,len:4.6,wid:2,h:1.2,cl:3,ch:.9,mass:1700,desc:'穩定耐撞'},
 {name:'黃色超跑',price:6000,color:0xf0b82e,kmh:200,acc:11,len:4.5,wid:2.1,h:.7,cl:1.7,ch:.5,mass:1300,desc:'加速兇猛'},
 {name:'黑色旗艦',price:12000,color:0x23262d,kmh:240,acc:12.5,len:5.2,wid:2.1,h:1.05,cl:2.8,ch:.75,mass:2000,desc:'城市之王'}
];
function makeCar(s,color){
  const g=new THREE.Group();g.rotation.order='YXZ';g.userData.wheels=[];g.userData.fronts=[];
  const bh=.7*s.h,top=.3+bh;
  g.add(B(s.wid,bh,s.len,color,0,.3+bh/2,0));
  g.add(B(s.wid*.88,s.ch,s.cl,0x2d4a63,0,top+s.ch/2,.25));
  g.add(B(s.wid*.92,.08,s.cl*.92,color,0,top+s.ch+.04,.25));
  g.add(B(s.wid*1.02,.25,.25,0x20242b,0,.45,-s.len/2));
  g.add(B(s.wid*1.02,.25,.25,0x20242b,0,.45,s.len/2));
  [-1,1].forEach(k=>{
    g.add(B(.4,.2,.08,0xfff6c0,k*s.wid*.33,.3+bh*.6,-s.len/2-.02,false));
    g.add(B(.45,.2,.08,0xff3030,k*s.wid*.33,.3+bh*.6,s.len/2+.02,false));
  });
  [[-1,-1],[1,-1],[-1,1],[1,1]].forEach(([sx,sz])=>{
    const steer=new THREE.Group(),spin=new THREE.Group();
    const w=new THREE.Mesh(new THREE.CylinderGeometry(.38,.38,.3,12),M(0x15171c));
    w.rotation.z=Math.PI/2;w.castShadow=true;spin.add(w);
    const hub=new THREE.Mesh(new THREE.CylinderGeometry(.2,.2,.32,8),M(0xb8bcc6));hub.rotation.z=Math.PI/2;spin.add(hub);
    steer.add(spin);steer.position.set(sx*(s.wid/2),.38,sz*s.len*.31);
    g.add(steer);g.userData.wheels.push(spin);if(sz<0)g.userData.fronts.push(steer);
  });
  return g;
}
const car=new THREE.Group();car.rotation.order='YXZ';scene.add(car);
let cur=0,owned=[true,false,false,false,false],money=0,carMesh=null;
function buildCar(){if(carMesh)car.remove(carMesh);carMesh=makeCar(CARS[cur],CARS[cur].color);car.add(carMesh);setText($('carName'),CARS[cur].name+' · 極速 '+CARS[cur].kmh)}
car.position.set(off+STEP/2,0,off+LANE);
let heading=-Math.PI/2,speed=0,steer=0,wheelRoll=0,kvx=0,kvz=0,plW=0,py=0,pvy=0,gt=0,lastHit=-9,shakeV=0,flashV=0;
const pl={x:0,z:0,ang:0,vx:0,vz:0,w:0,hw:1,hl:2,im:1/1000,iI:1/1000};

/* ================= 物理(OBB 碰撞) ================= */
function axesOf(o){const s=Math.sin(o.ang),c=Math.cos(o.ang);return[[-s,-c],[c,-s]]}
function sat(a,b){
  const A=axesOf(a),Bx=axesOf(b),ddx=b.x-a.x,ddz=b.z-a.z;
  let best=1e9,bn=null;
  const list=[A[0],A[1],Bx[0],Bx[1]];
  for(let i=0;i<4;i++){
    const u=list[i],d=ddx*u[0]+ddz*u[1];
    const ra=a.hl*Math.abs(A[0][0]*u[0]+A[0][1]*u[1])+a.hw*Math.abs(A[1][0]*u[0]+A[1][1]*u[1]);
    const rb=b.hl*Math.abs(Bx[0][0]*u[0]+Bx[0][1]*u[1])+b.hw*Math.abs(Bx[1][0]*u[0]+Bx[1][1]*u[1]);
    const o=ra+rb-Math.abs(d);
    if(o<=0)return null;
    if(o<best){best=o;bn=d<0?[-u[0],-u[1]]:[u[0],u[1]]}
  }
  return{nx:bn[0],nz:bn[1],depth:best};
}
function support(o,nx,nz){
  const ax=axesOf(o),f=ax[0],r=ax[1];
  const sf=Math.sign(f[0]*nx+f[1]*nz)||1,sr=Math.sign(r[0]*nx+r[1]*nz)||1;
  return[o.x+sf*o.hl*f[0]+sr*o.hw*r[0],o.z+sf*o.hl*f[1]+sr*o.hw*r[1]];
}
function collide(a,b,e){
  const tot=a.im+b.im;if(tot===0)return 0;
  const s=sat(a,b);if(!s)return 0;
  const nx=s.nx,nz=s.nz;
  a.x-=nx*s.depth*a.im/tot;a.z-=nz*s.depth*a.im/tot;
  b.x+=nx*s.depth*b.im/tot;b.z+=nz*s.depth*b.im/tot;
  const pa=support(a,nx,nz),pb=support(b,-nx,-nz);
  const cX=(pa[0]+pb[0])/2,cZ=(pa[1]+pb[1])/2;
  const rax=cX-a.x,raz=cZ-a.z,rbx=cX-b.x,rbz=cZ-b.z;
  const vax=a.vx-a.w*raz,vaz=a.vz+a.w*rax,vbx=b.vx-b.w*rbz,vbz=b.vz+b.w*rbx;
  const vn=(vbx-vax)*nx+(vbz-vaz)*nz;
  if(vn>0)return 0;
  const cra=rax*nz-raz*nx,crb=rbx*nz-rbz*nx;
  const j=-(1+e)*vn/(a.im+b.im+cra*cra*a.iI+crb*crb*b.iI);
  a.vx-=j*nx*a.im;a.vz-=j*nz*a.im;a.w-=cra*j*a.iI*.7;
  b.vx+=j*nx*b.im;b.vz+=j*nz*b.im;b.w+=crb*j*b.iI*.7;
  a.w=clamp(a.w,-4,4);b.w=clamp(b.w,-4,4);
  return -vn;
}

/* ================= 其他車輛:停放車 + 行駛車 ================= */
const bodies=[],ai=[];
const AICOL=[0xd9534f,0x5bc0de,0xf0ad4e,0x8e7cc3,0x6aa84f,0xeeeeee,0x444c5a];
function newBody(spec,kind,color){
  const g=makeCar(spec,color);scene.add(g);
  const b={g,spec,kind,x:0,z:0,ang:0,vx:0,vz:0,w:0,y:0,vy:0,hw:spec.wid/2,hl:spec.len/2,im:1/spec.mass,iI:1/(spec.mass*(spec.len*spec.len+spec.wid*spec.wid)/6),wreck:false,wt:0,rest:0,id:bodies.length,roll:0};
  bodies.push(b);return b;
}
function syncBody(b){
  b.g.position.set(b.x,b.y,b.z);b.g.rotation.y=b.ang;
  if(b.wreck){b.g.rotation.x=clamp(-b.vy*.04,-.5,.5);b.g.rotation.z=b.y>.05?clamp(b.w*.08,-.6,.6):0}
  else{b.g.rotation.x=0;b.g.rotation.z=0}
}
function wreckIt(b){if(!b.wreck){b.wreck=true;b.wt=0;b.rest=0}}
// 停放的車
(function(){
  const idx=[];while(idx.length<36){const i=(Math.random()*bays.length)|0;if(!idx.includes(i)&&Math.hypot(bays[i].x-(off+STEP/2),bays[i].z-off)>40)idx.push(i)}
  idx.forEach(i=>{
    const bay=bays[i];bay.occ=true;
    const s=CARS[(Math.random()*4)|0];
    const b=newBody(s,'parked',AICOL[(Math.random()*AICOL.length)|0]);
    b.x=bay.x+(Math.random()-.5)*.4;b.z=bay.z+(Math.random()-.5)*.4;
    const flip=Math.random()<.5?1:-1;
    b.ang=bay.axis==='x'?flip*Math.PI/2:(flip>0?0:Math.PI);
    syncBody(b);
  });
})();
function aiHeading(a){return a.axis==='x'?(a.dir>0?-Math.PI/2:Math.PI/2):(a.dir>0?Math.PI:0)}
function aiLane(a){if(a.axis==='x')a.z=a.line+a.dir*LANE;else a.x=a.line-a.dir*LANE}
function placeAI(a){
  for(let n=0;n<25;n++){
    a.axis=Math.random()<.5?'x':'z';a.dir=Math.random()<.5?1:-1;
    a.line=off+((Math.random()*(N+1))|0)*STEP;
    const along=(Math.random()-.5)*(SIZE-30);
    if(a.axis==='x')a.x=along;else a.z=along;
    aiLane(a);
    if(Math.hypot(a.x-car.position.x,a.z-car.position.z)>70)break;
  }
  a.ang=aiHeading(a);a.wreck=false;a.vx=a.vz=a.w=0;a.y=0;a.vy=0;a.wt=0;a.rest=0;
}
for(let n=0;n<18;n++){
  const b=newBody(CARS[(Math.random()*3)|0],'ai',AICOL[(Math.random()*AICOL.length)|0]);
  b.v=8+Math.random()*5;placeAI(b);syncBody(b);ai.push(b);
}
function updateAI(dt){
  for(const a of ai){
    if(a.wreck)continue;
    const key=a.axis,prev=a[key];
    const fx=a.axis==='x'?a.dir:0,fz=a.axis==='z'?a.dir:0;
    let slow=1;
    const rx=car.position.x-a.x,rz=car.position.z-a.z,fd=rx*fx+rz*fz,sd=Math.abs(rx*fz-rz*fx);
    if(fd>0&&fd<14&&sd<3)slow=Math.max(0,(fd-5)/9);
    for(const o of bodies){
      if(o===a||!(o.kind==='ai'||o.wreck))continue;
      const ox=o.x-a.x,oz=o.z-a.z,d=ox*fx+oz*fz,s2=Math.abs(ox*fz-oz*fx);
      if(d>0&&d<12&&s2<2.6)slow=Math.min(slow,Math.max(0,(d-5)/7));
    }
    a[key]+=a.dir*a.v*slow*dt;
    a.vx=fx*a.v*slow;a.vz=fz*a.v*slow;
    const kp=Math.floor((prev-off)/STEP),kn=Math.floor((a[key]-off)/STEP);
    if(kp!==kn&&Math.random()<.3){
      const c=off+Math.max(kp,kn)*STEP,old=a.line,oldAxis=a.axis;
      a.axis=oldAxis==='x'?'z':'x';a.dir=Math.random()<.5?1:-1;a.line=c;
      if(oldAxis==='x'){a.x=c;a.z=old}else{a.z=c;a.x=old}
    }
    if(Math.abs(a[a.axis])>LIM-3){a.dir=-a.dir;a[a.axis]=Math.sign(a[a.axis])*(LIM-3.5)}
    aiLane(a);
    const d=Math.atan2(Math.sin(aiHeading(a)-a.ang),Math.cos(aiHeading(a)-a.ang));
    a.ang+=d*Math.min(1,dt*6);
    a.roll+=a.v*slow*dt/.38;a.g.userData.wheels.forEach(w=>w.rotation.x=a.roll);
  }
}
function updateWrecks(dt){
  for(const a of bodies){
    if(!a.wreck)continue;
    const fr=Math.exp(-(a.y>.05?.3:1.9)*dt);
    a.vx*=fr;a.vz*=fr;a.w*=Math.exp(-2*dt);
    a.x+=a.vx*dt;a.z+=a.vz*dt;a.ang-=a.w*dt;
    a.y+=a.vy*dt;a.vy-=18*dt;
    if(a.y<0){a.y=0;a.vy=Math.abs(a.vy)>3?-a.vy*.3:0}
    a.wt+=dt;
    if(Math.hypot(a.vx,a.vz)<.5&&Math.abs(a.w)<.3&&a.y<=0)a.rest+=dt;else a.rest=0;
  }
  for(const a of bodies){
    if(!a.wreck)continue;
    for(const b of bodies){
      if(a===b||(b.wreck&&b.id<a.id))continue;
      const ddx=b.x-a.x,ddz=b.z-a.z;if(ddx*ddx+ddz*ddz>40)continue;
      const imp=collide(a,b,.4);
      if(imp>1.5)wreckIt(b);
      if(imp>8){b.vy=Math.max(b.vy,Math.min(4,imp*.1))}
    }
    if(Math.hypot(a.vx,a.vz)>.2||Math.abs(a.w)>.1){
      for(const bl of buildings){
        if(Math.abs(bl.x-a.x)>bl.hw+5||Math.abs(bl.z-a.z)>bl.hw+5)continue;
        const imp=collide(a,bl,.35);
        if(imp>8)a.vy=Math.max(a.vy,Math.min(3,imp*.08));
      }
    }
    if(Math.abs(a.x)>LIM){a.x=Math.sign(a.x)*LIM;a.vx*=-.3}
    if(Math.abs(a.z)>LIM){a.z=Math.sign(a.z)*LIM;a.vz*=-.3}
    if(a.kind==='ai'&&a.wt>10&&a.rest>1&&Math.hypot(a.x-car.position.x,a.z-car.position.z)>45)placeAI(a);
  }
  bodies.forEach(syncBody);
}

function roadPoint(side){
  for(let n=0;n<60;n++){
    const i=(Math.random()*(N+1))|0,t=(Math.random()-.5)*(SIZE-40);
    if(roadDist(t)<ROAD/2+3)continue;
    const p=off+i*STEP,sg=Math.random()<.5?1:-1,s=side?sg*(ROAD/2+.9):sg*3;
    return Math.random()<.5?{x:t,z:p+s}:{x:p+s,z:t};

function pickPoint(from,min,max,side){

function startMission(p){
  const type=p.userData.type,T=TYPES[type],from={x:p.position.x,z:p.position.z};
  scene.remove(p);pax.splice(pax.indexOf(p),1);
  mission={type,from,t0:gt,stage:0,comfort:100};
  if(type==='valet'){
    let bay=null;
    for(let n=0;n<300;n++){
      const b=bays[(Math.random()*bays.length)|0];
      const d=Math.hypot(b.x-from.x,b.z-from.z);
      if(!b.occ&&d>100&&d<380){bay=b;break}
    }
    if(!bay)bay=bays.find(b=>!b.occ);
    mission.bay=bay;mission.dist=Math.hypot(bay.x-from.x,bay.z-from.z);mission.limit=mission.dist/12+60;
    setTarget(bay.x,bay.z,0x2fbf9a,'#2fbf9a',bay);

  }else if(type==='multi'){

    mission.B=B1;mission.C=C;mission.dist=Math.hypot(B1.x-from.x,B1.z-from.z)+Math.hypot(C.x-B1.x,C.z-B1.z);
    mission.limit=mission.dist/13+35;
    friend=new THREE.Group();friend.add(makePerson(0x3aa0e0));

    const d=pickPoint(from,lo,hi,false);
    mission.dist=Math.hypot(d.x-from.x,d.z-from.z);
    mission.limit=type==='rush'?mission.dist/21+10:type==='vip'?mission.dist/9+40:mission.dist/14+25;
    setTarget(d.x,d.z,0x3cb371,'#3cb371');
    say(type==='vip'?'貴賓上車,請平穩駕駛':type==='rush'?'趕時間!快!':'乘客上車了');
  }
}
function finishMission(extra){
  const m=mission,left=Math.max(0,m.limit-(gt-m.t0));let fare=0,note='';
  if(m.type==='ride')fare=25+m.dist*.45+left*1.5;
  else if(m.type==='rush'){if(left>0){fare=(30+m.dist*.7)*1.6+left*2;note='準時!'}else{fare=(30+m.dist*.5)*.6;note='遲到了,車資打折'}}
  else if(m.type==='vip'){const c=Math.max(30,m.comfort);fare=(30+m.dist*.6)*1.4*c/100;note='舒適度 '+Math.round(c)+'%'}
  else if(m.type==='multi')fare=60+m.dist*.5+left*1.2;
  else fare=50+m.dist*.35+(extra||0)+left*.8;
  fare=Math.round(fare);money+=fare;updateMoney();save();
  toast('任務完成 +$'+fare+(note?'\n'+note:'')+(m.type==='valet'?'\n停車精準度 '+Math.round((extra||0)/60*100)+'%':''));
  clearMission();

let ac,osc,gn,mute=false;
function initAudio(){
  if(ac)return;
  try{
    ac=new(window.AudioContext||window.webkitAudioContext)();
    osc=ac.createOscillator();osc.type='sawtooth';
    const f=ac.createBiquadFilter();f.type='lowpass';f.frequency.value=420;
    gn=ac.createGain();gn.gain.value=0;
    osc.connect(f);f.connect(gn);gn.connect(ac.destination);osc.start();
  }catch(e){}
}
function thump(v){
  if(!ac||mute)return;
  const o=ac.createOscillator(),g=ac.createGain(),t=ac.currentTime;
  o.type='square';o.frequency.setValueAtTime(110,t);o.frequency.exponentialRampToValueAtTime(35,t+.25);
  g.gain.setValueAtTime(Math.min(.25,.04+v*.006),t);g.gain.exponentialRampToValueAtTime(.001,t+.3);
  o.connect(g);g.connect(ac.destination);o.start();o.stop(t+.32);
}

function onImpact(v){
  if(v<2)return;
  shakeV=Math.min(1.2,v*.05);flashV=Math.min(.9,v*.03);thump(v);
  if(v>8)pvy=Math.max(pvy,Math.min(3.5,v*.1));
  if(gt-lastHit>.6){
    lastHit=gt;say('撞擊 '+Math.round(v*3.6)+' km/h!');
    if(mission&&mission.type==='vip')mission.comfort-=Math.min(35,v*2);
  }
}

/* ================= 主迴圈 ================= */
const clock=new THREE.Clock();
function updateCard(){
  const card=$('card');
  if(!mission){
    card.style.borderLeftColor='#999';setText($('cTitle'),'待命中');
    setText($('cLine'),pax.length?'開到彩色圓點旁接單':'');$('cBar').style.width='0';$('cAbort').style.display='none';return;
  }
  const m=mission,T=TYPES[m.type],tg=m.target;
  const dd=Math.round(Math.hypot(tg.x-car.position.x,tg.z-car.position.z));
  const left=Math.max(0,m.limit-(gt-m.t0));
  card.style.borderLeftColor=T.css;$('cAbort').style.display='inline-block';
  let title=T.name,line='',bar=left/m.limit,col=T.css;
  if(m.type==='ride')line='前往目的地 '+dd+' m · 剩 '+Math.ceil(left)+' 秒';
  else if(m.type==='rush'){line='⏱ '+Math.ceil(left)+' 秒 · 距離 '+dd+' m';if(left<=0)line='遲到了! 距離 '+dd+' m'}
  else if(m.type==='vip'){line='舒適度 '+Math.max(0,Math.round(m.comfort))+'% · 限速 60 · '+dd+' m';bar=Math.max(0,m.comfort)/100;if(speed*3.6>60)col='#e8402f'}
  else if(m.type==='multi'){title=T.name+(m.stage===0?' · 接朋友':' · 送達');line=(m.stage===0?'去藍色光柱接人 ':'前往目的地 ')+dd+' m'}
  else{title='代客停車';line=m.hint||'開到車位旁,車身和車位平行';bar=parkHold/1.2;col='#2fbf9a'}
  setText($('cTitle'),title);setText($('cLine'),line);
  $('cBar').style.width=Math.max(0,Math.min(1,bar))*100+'%';$('cBar').style.background=col;
}
let uiT=0;
function loop(){
  requestAnimationFrame(loop);
  const dt=Math.min(clock.getDelta(),.05),t=clock.elapsedTime;
  if($('mapWrap').style.display==='flex')drawFull();
  if(!paused){
    gt+=dt;
    const C=CARS[cur],vmax=C.kmh/3.6;
    const gasIn=gas||keys['w']||keys['arrowup'],brkIn=brk||keys['s']||keys['arrowdown'],hand=keys[' '];
    const sIn=dragging?touchSteer:((keys['d']||keys['arrowright']?1:0)-(keys['a']||keys['arrowleft']?1:0));
    steer+=(sIn-steer)*Math.min(1,dt*(sIn===0?9:6));
    if(gasIn){
      if(speed<0)speed+=(C.acc+25)*dt;else speed+=C.acc*Math.max(0,1-speed/(vmax*1.02))*dt;
    }else if(brkIn){
      if(speed>.4)speed-=(C.acc*2+22)*dt;else speed=Math.max(-8,speed-5*dt);
    }else speed-=Math.sign(speed)*Math.min(Math.abs(speed),(1.2+Math.abs(speed)*.05)*dt);
    if(hand)speed-=Math.sign(speed)*Math.min(Math.abs(speed),30*dt);
    speed=clamp(speed,-8,vmax);
    const delta=steer*.62/(1+Math.abs(speed)/9)*(hand?1.6:1);
    heading-=speed/2.8*Math.tan(delta)*dt;
    heading-=plW*dt;plW*=Math.exp(-3*dt);
    const fx=-Math.sin(heading),fz=-Math.cos(heading);

    pl.x=car.position.x;pl.z=car.position.z;pl.ang=heading;pl.hw=C.wid/2;pl.hl=C.len/2;
    pl.im=1/C.mass;pl.iI=1/(C.mass*(C.len*C.len+C.wid*C.wid)/6);
    pl.vx=fx*speed+kvx;pl.vz=fz*speed+kvz;pl.w=plW;
    pl.x+=pl.vx*dt;pl.z+=pl.vz*dt;
    let maxImp=0;
    for(const bl of buildings){
      if(Math.abs(bl.x-pl.x)>bl.hw+5||Math.abs(bl.z-pl.z)>bl.hw+5)continue;
      maxImp=Math.max(maxImp,collide(pl,bl,.3));
    }
    for(const b of bodies){
      const ddx=b.x-pl.x,ddz=b.z-pl.z;if(ddx*ddx+ddz*ddz>64)continue;
      const imp=collide(pl,b,.45);
      if(imp>0){
        maxImp=Math.max(maxImp,imp);
        if(imp>1.2)wreckIt(b);
        if(imp>8)b.vy=Math.max(b.vy,Math.min(5,imp*.14));
      }
    }
    if(Math.abs(pl.x)>LIM){pl.x=Math.sign(pl.x)*LIM;if(pl.vx*Math.sign(pl.x)>0){maxImp=Math.max(maxImp,Math.abs(pl.vx));pl.vx*=-.3}}
    if(Math.abs(pl.z)>LIM){pl.z=Math.sign(pl.z)*LIM;if(pl.vz*Math.sign(pl.z)>0){maxImp=Math.max(maxImp,Math.abs(pl.vz));pl.vz*=-.3}}
    speed=clamp(pl.vx*fx+pl.vz*fz,-12,vmax*1.1);
    kvx=(pl.vx-fx*speed)*Math.exp(-3.2*dt);kvz=(pl.vz-fz*speed)*Math.exp(-3.2*dt);
    plW=clamp(pl.w,-3.5,3.5);
    car.position.x=pl.x;car.position.z=pl.z;
    if(maxImp>2)onImpact(maxImp);

    py+=pvy*dt;pvy-=18*dt;if(py<0){py=0;pvy=0}
    const ty=(inRoad(car.position.x,car.position.z)?0:.2)+py;
    car.position.y+=(ty-car.position.y)*Math.min(1,dt*(py>0?30:14));
    car.rotation.y=heading;
    carMesh.rotation.x=clamp(-pvy*.03,-.3,.3);
    wheelRoll+=speed*dt/.38;
    carMesh.userData.wheels.forEach(w=>w.rotation.x=wheelRoll);
    carMesh.userData.fronts.forEach(w=>w.rotation.y=-delta*2);

    updateAI(dt);updateWrecks(dt);

    /* 任務 */
    const slow=Math.abs(speed)<3;
    if(!mission){
      let near=1e9,np=null;
      pax.forEach(p=>{const d=p.position.distanceTo(car.position);if(d<near){near=d;np=p}});
      if(np&&near<6&&slow)startMission(np);
      else if(np&&near<25)say(TYPES[np.userData.type].name+':放慢到 10 km/h 以下上車');
      else if(!mission)say('找地圖上的彩色點接單!');
    }else{
      const m=mission,tg=m.target,dd=Math.hypot(tg.x-car.position.x,tg.z-car.position.z);
      if(m.type==='vip'&&speed*3.6>60){m.comfort-=8*dt;say('太快了!貴賓不舒服 (限速 60)')}
      if(m.type==='valet'){
        const bay=m.bay,ax=bay.axis==='x';
        const along=ax?car.position.x-bay.x:car.position.z-bay.z,across=ax?car.position.z-bay.z:car.position.x-bay.x;
        const axisAng=ax?Math.PI/2:0;
        let ad=((heading-axisAng)%Math.PI+Math.PI*1.5)%Math.PI-Math.PI/2;
        const near=Math.abs(along)<5&&Math.abs(across)<4;
        if(!near){m.hint='開到車位旁 '+Math.round(dd)+' m';parkHold=0}
        else if(Math.abs(ad)>.2){m.hint='車身要和車位平行';parkHold=0}
        else if(Math.abs(along)>1.6){m.hint=along>0?'再往後退一點':'再往前開一點';parkHold=0}
        else if(Math.abs(across)>1){m.hint='要停在車位中間';parkHold=0}
        else if(Math.abs(speed)>.8){m.hint='停穩 (放開油門/踩煞車)';parkHold=0}
        else{m.hint='停好了,保持不動...';parkHold+=dt}
        if(parkHold>=1.2){
          const acc=clamp(1-(Math.abs(along)/1.6*.4+Math.abs(across)/1*.3+Math.abs(ad)/.2*.3),0,1);
          finishMission(Math.round(60*acc));
        }
      }else if(dd<6.5&&slow){
        if(m.type==='multi'&&m.stage===0){
          m.stage=1;scene.remove(friend);friend=null;
          setTarget(m.C.x,m.C.z,0x3cb371,'#3cb371');say('朋友上車了,前往目的地');
        }else finishMission();
      }
    }
    while(pax.length<14)spawnPax();
    pax.forEach(p=>{
      const u=p.userData;
      u.beam.material.opacity=.22+.12*Math.sin(t*3+u.ph);
      u.person.position.y=Math.abs(Math.sin(t*4+u.ph))*.08;
      u.person.userData.arm.rotation.z=2.6+Math.sin(t*7+u.ph)*.4;
      p.lookAt(car.position.x,p.position.y,car.position.z);
    });
    if(friend){friend.children[0].userData.arm.rotation.z=2.6+Math.sin(t*7)*.4;friend.lookAt(car.position.x,friend.position.y,car.position.z)}
    setText($('spd').firstChild,Math.round(Math.abs(speed)*3.6)+' km/h');
    uiT+=dt;if(uiT>.1){uiT=0;updateCard()}

    if(gn){
      const r=Math.abs(speed)/vmax*5,gr=Math.min(4,Math.floor(r)),fr=r-gr;
      osc.frequency.value=50+fr*70+gr*6+(gasIn?10:0);
      gn.gain.value=mute?0:.035+(gasIn?.03:0);
    }
  }
  wheel.style.transform=`rotate(${(dragging?wheelAng:steer*1.3)}rad)`;
  flashV=Math.max(0,flashV-dt*1.6);$('flash').style.opacity=flashV;
  shakeV=Math.max(0,shakeV-dt*3);

  /* 鏡頭 */
  const fx=-Math.sin(heading),fz=-Math.cos(heading),v=Math.abs(speed);
  cam.fov+=(66+Math.min(20,v*.35)-cam.fov)*Math.min(1,dt*4);cam.updateProjectionMatrix();
  if(camMode===2){
    cam.position.set(car.position.x+fx*.3,car.position.y+1.5,car.position.z+fz*.3);
    cam.lookAt(car.position.x+fx*30,car.position.y+1.3,car.position.z+fz*30);
  }else{
    const m=camMode===0?{d:8,h:2.6,look:18,ly:1.1}:{d:13,h:5.5,look:12,ly:1};
    const tg=new THREE.Vector3(car.position.x-fx*m.d,car.position.y+m.h,car.position.z-fz*m.d);
    cam.position.lerp(tg,1-Math.exp(-9*dt));
    cam.lookAt(car.position.x+fx*m.look,car.position.y+m.ly,car.position.z+fz*m.look);
  }
  if(shakeV>0){cam.position.x+=(Math.random()-.5)*shakeV*.6;cam.position.y+=(Math.random()-.5)*shakeV*.6;cam.position.z+=(Math.random()-.5)*shakeV*.6}
  sun.position.set(car.position.x+60,100,car.position.z+35);sun.target.position.copy(car.position);
  drawMini();
  ren.render(scene,cam);
}
loop();
</script>
